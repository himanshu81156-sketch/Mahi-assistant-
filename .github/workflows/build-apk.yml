name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          MAJOR_VERSION=$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but found Java $MAJOR_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create temporary ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: $APK_PATH does not have a .apk extension."
              exit 1
              ;;
          esac
          echo "Verified APK: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_RELEASE_DIR=$(mktemp -d)
          DEST_APK="${TMP_RELEASE_DIR}/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK missing or empty."
            exit 1
          fi
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset must end in .apk."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}

          Note: This APK is intended for testing only, is not a Play Store production release, and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "Backup Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ "${{ steps.verify_apk.outcome }}" = "success" ]; then
              echo "The debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            fi
          fi
